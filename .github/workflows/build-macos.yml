name: Build macOS App

# 触发条件：当你推送代码到 main 或 master 分支时，自动运行
on:
  push:
    branches: [ main, master ]
  # 允许你手动在 GitHub 网页上点击运行
  workflow_dispatch:

jobs:
  build:
    # 关键：在 GitHub 提供的 macOS 最新环境上执行
    runs-on: macos-latest

    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境（这里使用 3.11）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装你的项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 如果你的项目有 requirements.txt，取消下面一行的注释
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 直接安装打包工具
          pip install pyinstaller

      # 4. 执行打包命令
      - name: Build app with PyInstaller
        run: |
          pyinstaller --windowed \
                      --target-arch universal2 \
                      --name "LogCollector" \
                      main.py

      # 5. 上传打包好的 .app 文件作为“工作流产物”
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogCollector-macOS
          path: dist/LogCollector.app